name: Daily AI Digest

on:
  schedule:
    - cron: '30 1 * * *'   # UTC 01:30 = 北京时间 09:30
  workflow_dispatch:        # 允许手动在 Actions 页面触发

permissions:
  contents: write           # 允许 commit + push 更新

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (含 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 edge-tts (Python)
        run: pip install edge-tts

      - name: 安装根项目依赖
        run: npm install

      - name: 安装 follow-builders 依赖
        working-directory: follow-builders/scripts
        run: npm install

      - name: 生成简报
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          LLM_MODEL: moonshot-v1-auto
        run: npm run digest

      - name: 文转语音 (Edge TTS)
        run: npm run tts

      - name: 更新 RSS feed
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: npm run feed

      - name: 提交今日简报到仓库
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/ feed.xml
          git diff --staged --quiet || git commit -m "digest: $(date -u +%Y-%m-%d)"
          git push

      - name: 发布 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: true

      - name: 微信推送 (WxPusher)
        env:
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: npm run notify

      - name: 企业微信群机器人推送
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: npm run notify:wecom
