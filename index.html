<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AI 简报" />
<link rel="apple-touch-icon" href="cover.jpg" />
<link rel="icon" href="cover.jpg" />
<title>AI 每日简报</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #0f172a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.6; }
  body { padding-bottom: env(safe-area-inset-bottom); }
  a { color: #67e8f9; text-decoration: none; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; gap: 14px; padding: 16px 4px 24px; }
  header img { width: 56px; height: 56px; border-radius: 12px; }
  header h1 { font-size: 18px; font-weight: 700; color: #f1f5f9; }
  header p { font-size: 12px; color: #94a3b8; margin-top: 2px; }
  .today-card { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 1px solid #334155; border-radius: 16px; padding: 20px; margin-bottom: 28px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .today-date { font-size: 13px; color: #67e8f9; font-weight: 600; letter-spacing: 0.5px; }
  .today-title { font-size: 22px; font-weight: 700; color: #f1f5f9; margin: 6px 0 16px; }
  audio { width: 100%; height: 44px; margin: 8px 0 14px; border-radius: 8px; }
  audio::-webkit-media-controls-panel { background-color: #1e293b; }
  .summary { font-size: 15px; color: #cbd5e1; background: rgba(15, 23, 42, 0.5); padding: 14px 16px; border-left: 3px solid #22d3ee; border-radius: 8px; margin-top: 6px; }
  .summary strong { color: #f1f5f9; }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .btn { flex: 1; min-width: 100px; padding: 10px 14px; background: rgba(34, 211, 238, 0.1); color: #67e8f9; border: 1px solid rgba(34, 211, 238, 0.3); border-radius: 10px; font-size: 13px; text-align: center; transition: background .2s; }
  .btn:active { background: rgba(34, 211, 238, 0.2); }
  h2.section { font-size: 14px; color: #94a3b8; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin: 8px 4px 14px; }
  .ep { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .ep-date { font-size: 12px; color: #67e8f9; font-weight: 600; }
  .ep-title { font-size: 15px; color: #f1f5f9; margin: 4px 0 10px; }
  .ep-summary { font-size: 13px; color: #94a3b8; }
  .empty { text-align: center; padding: 40px 20px; color: #64748b; }
  .footer { text-align: center; font-size: 12px; color: #64748b; padding: 32px 16px 24px; line-height: 1.8; }
  .footer a { color: #94a3b8; }
  .pin-tip { background: rgba(34, 211, 238, 0.08); border: 1px dashed rgba(34, 211, 238, 0.3); border-radius: 12px; padding: 12px 14px; font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
  .pin-tip strong { color: #67e8f9; }
  @media (max-width: 480px) {
    .today-title { font-size: 19px; }
    .summary { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="cover.jpg" alt="cover" />
    <div>
      <h1>AI 每日简报</h1>
      <p>每天 09:30 自动更新 · 通勤路上听</p>
    </div>
  </header>

  <div class="pin-tip">
    💡 <strong>把这个页面加到手机主屏幕</strong>，下次一点就开。<br>
    iPhone：Safari 底部分享 → 添加到主屏幕<br>
    Android：浏览器菜单 → 添加到主屏幕
  </div>

  <div id="today"></div>

  <h2 class="section">📚 历史简报</h2>
  <div id="history"><div class="empty">加载中...</div></div>

  <div class="footer">
    <a href="https://github.com/GaryZhang96/ai-pm-daily-digest">GitHub 源码</a> ·
    <a href="feed.xml">RSS 订阅</a><br>
    数据源：<a href="https://github.com/zarazhangrui/follow-builders">follow-builders</a> by Zara Zhang
  </div>
</div>

<script>
  const SITE = window.location.origin + window.location.pathname.replace(/index\.html$/, '').replace(/\/$/, '');

  function todayStr() {
    const d = new Date();
    const tz = d.getTimezoneOffset();
    if (tz < 0) {
      const local = new Date(d.getTime() - tz * 60000);
      return local.toISOString().slice(0, 10);
    }
    return d.toISOString().slice(0, 10);
  }

  function fmtDate(s) {
    const [y, m, d] = s.split('-');
    return `${parseInt(m)}月${parseInt(d)}日`;
  }

  async function fetchEpisodes() {
    const res = await fetch('feed.xml?_=' + Date.now());
    const xml = await res.text();
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const items = [...doc.querySelectorAll('item')];
    return items.map(it => {
      const guid = it.querySelector('guid')?.textContent?.trim() || '';
      const title = it.querySelector('title')?.textContent?.trim() || guid;
      const desc = it.querySelector('description')?.textContent?.trim() || '';
      const enc = it.querySelector('enclosure');
      const audioUrl = enc?.getAttribute('url') || '';
      const link = it.querySelector('link')?.textContent?.trim() || '';
      return { date: guid, title, desc, audioUrl, link };
    });
  }

  function renderToday(ep) {
    const el = document.getElementById('today');
    if (!ep) {
      el.innerHTML = `<div class="today-card"><div class="today-date">${fmtDate(todayStr())}</div><div class="today-title">今天还没生成简报</div><div class="summary">每天 09:30 自动更新。如果今天还没到这个时间，请稍后回来查看。</div></div>`;
      return;
    }
    el.innerHTML = `
      <div class="today-card">
        <div class="today-date">${fmtDate(ep.date)} · 今日</div>
        <div class="today-title">${ep.title}</div>
        <audio controls preload="metadata" src="${ep.audioUrl}"></audio>
        <div class="summary"><strong>今日要点</strong><br>${ep.desc}</div>
        <div class="actions">
          <a class="btn" href="${ep.audioUrl}" target="_blank">下载 MP3</a>
          <a class="btn" href="output/${ep.date}/digest.md" target="_blank">查看全文</a>
        </div>
      </div>
    `;
  }

  function renderHistory(eps) {
    const el = document.getElementById('history');
    if (!eps.length) {
      el.innerHTML = `<div class="empty">暂无历史简报</div>`;
      return;
    }
    el.innerHTML = eps.map(ep => `
      <div class="ep">
        <div class="ep-date">${fmtDate(ep.date)}</div>
        <div class="ep-title">${ep.title}</div>
        <audio controls preload="none" src="${ep.audioUrl}"></audio>
        <div class="ep-summary">${ep.desc.slice(0, 200)}${ep.desc.length > 200 ? '…' : ''}</div>
      </div>
    `).join('');
  }

  (async () => {
    try {
      const eps = await fetchEpisodes();
      const today = todayStr();
      const todayEp = eps.find(e => e.date === today) || eps[0];
      const history = eps.filter(e => e !== todayEp).slice(0, 14);
      renderToday(todayEp);
      renderHistory(history);
    } catch (err) {
      document.getElementById('today').innerHTML = `<div class="today-card"><div class="today-title">加载失败</div><div class="summary">${err.message}</div></div>`;
      document.getElementById('history').innerHTML = '';
    }
  })();
</script>
</body>
</html>
